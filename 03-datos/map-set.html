<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map y Set</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
        h1 { font-size: 1.3rem; }
        p.intro { color: #555; }
        pre { background: #f4f4f4; padding: .75rem 1rem; border-radius: 6px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Map y Set</h1>
    <p class="intro"><code>Set</code> guarda valores sin repetir. <code>Map</code> guarda pares clave-valor como un objeto, pero la clave puede ser de cualquier tipo y conserva el orden de inserción.</p>
    <pre id="salida"></pre>
    <script>
        // Set: elimina duplicados
        const numeros = [1, 2, 2, 3, 3, 3];
        const unicos = new Set(numeros);
        unicos.add(4);
        unicos.add(1); // ya existe: no se agrega de nuevo

        // Map: contar cuántas veces aparece cada palabra
        const palabras = ["pera", "uva", "pera", "mango", "uva", "pera"];
        const conteo = new Map();
        for (const palabra of palabras) {
            conteo.set(palabra, (conteo.get(palabra) ?? 0) + 1);
        }

        const lineasConteo = [...conteo].map(([palabra, veces]) => `  ${palabra}: ${veces}`).join("\n");

        document.getElementById("salida").textContent =
            `Set a partir de ${JSON.stringify(numeros)}\n` +
            `valores      -> ${JSON.stringify([...unicos])}\n` +
            `.size        -> ${unicos.size}\n` +
            `.has(3)      -> ${unicos.has(3)}\n\n` +
            `Map con el conteo de palabras:\n${lineasConteo}\n` +
            `.get("pera") -> ${conteo.get("pera")}\n` +
            `.size        -> ${conteo.size}`;
    </script>
</body>
</html>
