<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>map, filter, reduce</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
        h1 { font-size: 1.3rem; }
        h2 { font-size: 1rem; margin-top: 1.5rem; }
        p.intro { color: #555; }
        pre { background: #f4f4f4; padding: .75rem 1rem; border-radius: 6px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Recorrer arrays: map, filter, reduce</h1>
    <p class="intro">Estos métodos recorren un array y devuelven un resultado, sin necesidad de escribir un bucle a mano.</p>

    <h2>map: transforma cada elemento</h2>
    <pre id="map"></pre>

    <h2>filter: se queda con los que cumplen una condición</h2>
    <pre id="filter"></pre>

    <h2>reduce: combina todo en un solo valor</h2>
    <pre id="reduce"></pre>

    <script>
        const numeros = [1, 2, 3, 4, 5, 6];

        // map: devuelve un array del mismo tamaño, transformado
        const dobles = numeros.map(n => n * 2);

        // filter: devuelve un array más corto (solo los que pasan el filtro)
        const pares = numeros.filter(n => n % 2 === 0);

        // reduce: acumula un valor recorriendo el array
        const suma = numeros.reduce((acumulado, n) => acumulado + n, 0);

        document.getElementById("map").textContent =
            `[${numeros}].map(n => n * 2)\n-> [${dobles}]`;
        document.getElementById("filter").textContent =
            `[${numeros}].filter(n => n % 2 === 0)\n-> [${pares}]`;
        document.getElementById("reduce").textContent =
            `[${numeros}].reduce((a, n) => a + n, 0)\n-> ${suma}`;
    </script>
</body>
</html>
