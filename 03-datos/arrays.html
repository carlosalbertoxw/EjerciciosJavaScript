<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
        h1 { font-size: 1.3rem; }
        p.intro { color: #555; }
        pre { background: #f4f4f4; padding: .75rem 1rem; border-radius: 6px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Arrays (listas)</h1>
    <p class="intro">Un array guarda varios valores en orden. Cada elemento tiene un índice que empieza en 0.</p>
    <pre id="salida"></pre>
    <script>
        const frutas = ["manzana", "pera", "uva"];

        // Métodos que MODIFican el array
        frutas.push("naranja");   // agrega al final
        const ultima = frutas.pop(); // quita y devuelve el último

        const salida = document.getElementById("salida");
        salida.textContent =
            `frutas            -> ${JSON.stringify(frutas)}\n` +
            `frutas[0]         -> ${frutas[0]}\n` +
            `frutas.length     -> ${frutas.length}\n` +
            `pop() devolvió    -> ${ultima}\n` +
            `includes("pera")  -> ${frutas.includes("pera")}\n` +
            `indexOf("uva")    -> ${frutas.indexOf("uva")}\n` +
            `join(" - ")       -> ${frutas.join(" - ")}`;
    </script>
</body>
</html>
