<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsualizar imagen</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
        h1 { font-size: 1.3rem; }
        p.intro { color: #555; }
        #preview { display: block; margin-top: 1rem; max-width: 300px; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>Previsualizar una imagen antes de subirla</h1>
    <p class="intro">Con <code>FileReader</code> leemos el archivo que elige el usuario y lo mostramos sin enviarlo a ningún servidor.</p>

    <input type="file" id="archivo" accept="image/*">
    <img id="preview" alt="Aquí aparecerá tu imagen">

    <script>
        const archivo = document.querySelector("#archivo");
        const preview = document.querySelector("#preview");

        archivo.addEventListener("change", () => {
            const imagen = archivo.files[0];
            if (!imagen) return;

            const lector = new FileReader();
            lector.addEventListener("load", (evento) => {
                preview.src = evento.target.result; // el resultado es la imagen en base64
            });
            lector.readAsDataURL(imagen);
        });
    </script>
</body>
</html>
