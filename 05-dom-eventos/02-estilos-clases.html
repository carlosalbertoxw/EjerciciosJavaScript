<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilos y clases</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; transition: background .2s, color .2s; }
        h1 { font-size: 1.3rem; }
        p.intro { color: #555; }
        button { font-size: 1rem; padding: .5rem 1rem; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
        /* Clase que activaremos desde JavaScript */
        body.oscuro { background: #1e1e1e; color: #eee; }
        body.oscuro p.intro { color: #aaa; }
    </style>
</head>
<body>
    <h1>Cambiar estilos y clases</h1>
    <p class="intro">Con <code>classList.toggle</code> añadimos o quitamos una clase CSS. Aquí alternamos un modo oscuro.</p>
    <button id="boton">Alternar modo oscuro</button>

    <script>
        const boton = document.querySelector("#boton");

        boton.addEventListener("click", () => {
            // toggle: si la clase está la quita, si no está la pone
            document.body.classList.toggle("oscuro");
        });
    </script>
</body>
</html>
