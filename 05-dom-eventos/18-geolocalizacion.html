<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocalización</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
        h1 { font-size: 1.3rem; }
        p.intro { color: #555; }
        button { font-size: 1rem; padding: .5rem 1rem; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
        #resultado { margin-top: 1rem; padding: 1rem; background: #f4f4f4; border-radius: 6px; white-space: pre-line; }
    </style>
</head>
<body>
    <h1>Obtener la ubicación (Geolocation API)</h1>
    <p class="intro">El navegador pedirá permiso antes de compartir la ubicación. La respuesta llega de forma asíncrona a través de dos funciones: éxito y error.</p>

    <button id="obtener">Obtener mi ubicación</button>
    <div id="resultado">Pulsa el botón para empezar.</div>

    <script>
        const resultado = document.querySelector("#resultado");

        document.querySelector("#obtener").addEventListener("click", () => {
            if (!navigator.geolocation) {
                resultado.textContent = "Tu navegador no soporta geolocalización.";
                return;
            }
            resultado.textContent = "Solicitando permiso...";
            navigator.geolocation.getCurrentPosition(exito, error, { timeout: 10000 });
        });

        function exito(posicion) {
            const { latitude, longitude } = posicion.coords;
            resultado.textContent = `Latitud: ${latitude}\nLongitud: ${longitude}`;
        }

        function error(err) {
            const mensajes = {
                1: "Permiso denegado por el usuario.",
                2: "No se pudo determinar la posición.",
                3: "Se agotó el tiempo de espera."
            };
            resultado.textContent = mensajes[err.code] || "Error desconocido.";
        }
    </script>
</body>
</html>
