<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tareas</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
        h1 { font-size: 1.3rem; }
        p.intro { color: #555; }
        form { display: flex; gap: .5rem; }
        input { flex: 1; font-size: 1rem; padding: .5rem; }
        button { font-size: 1rem; padding: .5rem 1rem; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { display: flex; align-items: center; gap: .5rem; padding: .5rem; border-bottom: 1px solid #eee; }
        li.hecha span { text-decoration: line-through; color: #999; }
        li span { flex: 1; }
        .borrar { background: #b91c1c; }
    </style>
</head>
<body>
    <h1>Lista de tareas (to-do)</h1>
    <p class="intro">Proyecto que integra varios conceptos: crear elementos, eventos y formularios. Agrega tareas, márcalas como hechas o bórralas.</p>

    <form id="formulario">
        <input type="text" id="nueva" placeholder="Nueva tarea..." required autofocus>
        <button type="submit">Agregar</button>
    </form>
    <ul id="lista"></ul>

    <script>
        const formulario = document.querySelector("#formulario");
        const entrada = document.querySelector("#nueva");
        const lista = document.querySelector("#lista");

        function crearTarea(texto) {
            const li = document.createElement("li");

            const span = document.createElement("span");
            span.textContent = texto;
            // clic en el texto -> marcar como hecha
            span.addEventListener("click", () => li.classList.toggle("hecha"));

            const borrar = document.createElement("button");
            borrar.textContent = "✕";
            borrar.className = "borrar";
            borrar.addEventListener("click", () => li.remove());

            li.append(span, borrar);
            return li;
        }

        formulario.addEventListener("submit", (evento) => {
            evento.preventDefault();
            const texto = entrada.value.trim();
            entrada.value = "";
            entrada.focus();
            if (texto === "") return; // required acepta espacios: los descartamos aquí
            lista.append(crearTarea(texto));
        });
    </script>
</body>
</html>
