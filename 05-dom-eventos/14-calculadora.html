<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 360px; margin: 2rem auto; padding: 0 1rem; color: #222; }
        h1 { font-size: 1.3rem; }
        p.intro { color: #555; }
        #pantalla { width: 100%; box-sizing: border-box; font-size: 2rem; text-align: right; padding: .5rem; margin-bottom: .5rem; border: 1px solid #ccc; border-radius: 6px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; }
        button { font-size: 1.25rem; padding: 1rem 0; border: none; border-radius: 6px; background: #e5e7eb; cursor: pointer; }
        button.op { background: #2563eb; color: #fff; }
        button.igual { background: #16a34a; color: #fff; grid-column: span 2; }
        button.limpiar { background: #b91c1c; color: #fff; grid-column: span 3; }
    </style>
</head>
<body>
    <h1>Calculadora</h1>
    <p class="intro">Combina eventos de botones con un poco de estado: el primer número, la operación elegida y si el siguiente dígito empieza un número nuevo. Cada operación es una función guardada en un objeto.</p>

    <input type="text" id="pantalla" value="0" readonly>
    <div class="grid">
        <button class="limpiar" data-accion="limpiar">C</button>
        <button class="op" data-operador="/">÷</button>

        <button data-digito="7">7</button>
        <button data-digito="8">8</button>
        <button data-digito="9">9</button>
        <button class="op" data-operador="*">×</button>

        <button data-digito="4">4</button>
        <button data-digito="5">5</button>
        <button data-digito="6">6</button>
        <button class="op" data-operador="-">−</button>

        <button data-digito="1">1</button>
        <button data-digito="2">2</button>
        <button data-digito="3">3</button>
        <button class="op" data-operador="+">+</button>

        <button data-digito="0">0</button>
        <button data-digito=".">.</button>
        <button class="igual" data-accion="igual">=</button>
    </div>

    <script>
        const pantalla = document.querySelector("#pantalla");

        // Cada operación es una función; así no hace falta evaluar texto como código
        const operaciones = {
            "+": (a, b) => a + b,
            "-": (a, b) => a - b,
            "*": (a, b) => a * b,
            "/": (a, b) => a / b
        };

        let primerNumero = null;
        let operadorPendiente = null;
        let empezarNumero = true; // el próximo dígito reemplaza lo que hay en pantalla

        function limpiar() {
            pantalla.value = "0";
            primerNumero = null;
            operadorPendiente = null;
            empezarNumero = true;
        }

        function escribirDigito(digito) {
            if (empezarNumero) {
                pantalla.value = digito === "." ? "0." : digito;
                empezarNumero = false;
            } else if (digito === "." && pantalla.value.includes(".")) {
                return; // un número solo puede tener un punto
            } else if (pantalla.value === "0" && digito !== ".") {
                pantalla.value = digito; // evita ceros a la izquierda
            } else {
                pantalla.value += digito;
            }
        }

        // Resuelve la operación pendiente, si la hay
        function calcular() {
            if (operadorPendiente === null || empezarNumero) return;

            const segundoNumero = Number(pantalla.value);
            if (operadorPendiente === "/" && segundoNumero === 0) {
                limpiar();
                pantalla.value = "Error";
                return;
            }

            const resultado = operaciones[operadorPendiente](primerNumero, segundoNumero);
            // Los decimales no son exactos (0.1 + 0.2 = 0.30000000000000004): redondeamos
            pantalla.value = Number(resultado.toPrecision(12));
            operadorPendiente = null;
            empezarNumero = true;
        }

        function elegirOperador(operador) {
            calcular();
            if (pantalla.value === "Error") return;
            primerNumero = Number(pantalla.value);
            operadorPendiente = operador;
            empezarNumero = true;
        }

        // Un solo listener para todos los botones (delegación de eventos)
        document.querySelector(".grid").addEventListener("click", (evento) => {
            const { digito, operador, accion } = evento.target.dataset;

            if (digito !== undefined) escribirDigito(digito);
            else if (operador !== undefined) elegirOperador(operador);
            else if (accion === "igual") calcular();
            else if (accion === "limpiar") limpiar();
        });
    </script>
</body>
</html>
