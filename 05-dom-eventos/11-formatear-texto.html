<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatear texto</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
        h1 { font-size: 1.3rem; }
        p.intro { color: #555; }
        input { font-size: 1rem; padding: .5rem; width: 100%; box-sizing: border-box; }
        #resultado { margin-top: 1rem; font-size: 1.2rem; min-height: 1.5em; }
    </style>
</head>
<body>
    <h1>Formatear texto como título</h1>
    <p class="intro">Pone en mayúscula la primera letra de cada palabra, salvo palabras cortas (de, la, y…). Escribe y sal del campo (Tab o clic fuera).</p>

    <input type="text" id="campo" placeholder="ej: historia de la programación y sus lenguajes" autofocus>
    <div id="resultado"></div>

    <script>
        const menores = ["de", "la", "los", "el", "del", "y", "e", "para", "sin", "las"];

        const capitalizar = palabra => palabra.charAt(0).toUpperCase() + palabra.slice(1);

        function formatearTitulo(texto) {
            const palabras = texto.trim().toLowerCase().split(/\s+/);
            return palabras
                .map((palabra, i) => {
                    // la primera palabra siempre va capitalizada
                    if (i !== 0 && menores.includes(palabra)) return palabra;
                    return capitalizar(palabra);
                })
                .join(" ");
        }

        const campo = document.querySelector("#campo");
        const resultado = document.querySelector("#resultado");
        campo.addEventListener("blur", () => {
            resultado.textContent = formatearTitulo(campo.value);
        });
    </script>
</body>
</html>
