<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento click</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; text-align: center; }
        h1 { font-size: 1.3rem; }
        p.intro { color: #555; }
        #contador { font-size: 3rem; font-weight: 700; margin: 1rem 0; }
        button { font-size: 1rem; padding: .5rem 1rem; margin: 0 .25rem; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Evento click: contador</h1>
    <p class="intro">El evento <code>click</code> se dispara al pulsar un botón. Cada handler modifica una variable y actualiza la pantalla.</p>
    <div id="contador">0</div>
    <button id="menos">−</button>
    <button id="reset">Reiniciar</button>
    <button id="mas">+</button>

    <script>
        let cuenta = 0;
        const pantalla = document.querySelector("#contador");
        const mostrar = () => pantalla.textContent = cuenta;

        document.querySelector("#mas").addEventListener("click", () => { cuenta++; mostrar(); });
        document.querySelector("#menos").addEventListener("click", () => { cuenta--; mostrar(); });
        document.querySelector("#reset").addEventListener("click", () => { cuenta = 0; mostrar(); });
    </script>
</body>
</html>
