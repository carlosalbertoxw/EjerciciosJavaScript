<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar y modificar el DOM</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
        h1 { font-size: 1.3rem; }
        p.intro { color: #555; }
        button { font-size: 1rem; padding: .5rem 1rem; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
        #caja { margin-top: 1rem; padding: 1rem; background: #f4f4f4; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>Seleccionar y modificar elementos</h1>
    <p class="intro">Con <code>querySelector</code> obtenemos un elemento y luego cambiamos su contenido con <code>textContent</code>.</p>

    <div id="caja">Texto original</div>
    <p><button id="boton">Cambiar el texto</button></p>

    <script>
        // Seleccionamos elementos por su id
        const caja = document.querySelector("#caja");
        const boton = document.querySelector("#boton");

        let veces = 0;
        boton.addEventListener("click", () => {
            veces++;
            caja.textContent = `Texto cambiado ${veces} vez(es)`;
        });
    </script>
</body>
</html>
