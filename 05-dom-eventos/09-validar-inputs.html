<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar inputs</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
        h1 { font-size: 1.3rem; }
        p.intro { color: #555; }
        pre { background: #f4f4f4; padding: .75rem 1rem; border-radius: 6px; white-space: pre-wrap; }
        .ok { color: #16a34a; }
        .error { color: #b91c1c; }
    </style>
</head>
<body>
    <h1>Validar campos con expresiones regulares</h1>
    <p class="intro">Cada tipo de dato (email, número, URL…) tiene un patrón. La función devuelve un mensaje vacío si es válido, o el error correspondiente.</p>
    <pre id="salida"></pre>

    <script>
        // Patrones por tipo de dato
        const patrones = {
            usuario: /^[0-9a-zA-Z-]+$/,
            numerico: /^[0-9]+$/,
            decimal: /^[0-9]+(\.[0-9]+)?$/,
            url: /^(http|https):\/\/[a-zA-Z0-9\-.]+\.[a-zA-Z]{2,}(\/\S*)?$/,
            email: /^[^@\s]+@[^@\s.]+(\.[^@\s.]+)+$/
        };

        // Devuelve "" si es válido, o un mensaje de error
        function validar(texto, tipo, longitudMax) {
            if (!patrones[tipo]) return `Tipo desconocido: ${tipo}`;
            if (!patrones[tipo].test(texto)) return `Formato inválido para "${tipo}"`;
            if (texto.length > longitudMax) return `Máximo ${longitudMax} caracteres`;
            return ""; // válido
        }

        // Casos de prueba: [valor, tipo, longitud]
        const casos = [
            ["carlos-123", "usuario", 25],
            ["24680", "numerico", 10],
            ["24680.2", "decimal", 10],
            ["https://github.com/carlosalbertoxw", "url", 500],
            ["prueba@correo.com", "email", 50],
            ["correo-malo", "email", 50]
        ];

        const lineas = casos.map(([valor, tipo, longitud]) => {
            const error = validar(valor, tipo, longitud);
            const estado = error === "" ? "OK - válido" : `ERROR - ${error}`;
            return `${tipo.padEnd(9)} "${valor}"\n   -> ${estado}`;
        });

        document.getElementById("salida").textContent = lineas.join("\n");
    </script>
</body>
</html>
