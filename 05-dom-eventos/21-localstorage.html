<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>localStorage</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
        h1 { font-size: 1.3rem; }
        p.intro { color: #555; }
        input { font-size: 1rem; padding: .5rem; width: 100%; box-sizing: border-box; }
        button { font-size: 1rem; padding: .5rem 1rem; border: none; border-radius: 6px; background: #b91c1c; color: #fff; cursor: pointer; margin-top: .5rem; }
        #estado { margin-top: 1rem; padding: 1rem; background: #f4f4f4; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>Guardar datos con localStorage</h1>
    <p class="intro">Lo que escribas se guarda en el navegador y sigue ahí aunque recargues o cierres la pestaña. Escribe algo y recarga la página para comprobarlo.</p>

    <input type="text" id="nota" placeholder="Escribe una nota...">
    <button id="borrar">Borrar nota guardada</button>
    <div id="estado"></div>

    <script>
        const nota = document.querySelector("#nota");
        const estado = document.querySelector("#estado");
        const CLAVE = "mi-nota";

        // Al cargar, recuperamos lo guardado (si existe)
        const guardado = localStorage.getItem(CLAVE);
        if (guardado !== null) {
            nota.value = guardado;
            estado.textContent = `Nota recuperada: "${guardado}"`;
        } else {
            estado.textContent = "No hay ninguna nota guardada todavía.";
        }

        // Cada cambio se guarda automáticamente
        nota.addEventListener("input", () => {
            localStorage.setItem(CLAVE, nota.value);
            estado.textContent = `Guardado: "${nota.value}"`;
        });

        document.querySelector("#borrar").addEventListener("click", () => {
            localStorage.removeItem(CLAVE);
            nota.value = "";
            estado.textContent = "Nota borrada del almacenamiento.";
        });
    </script>
</body>
</html>
