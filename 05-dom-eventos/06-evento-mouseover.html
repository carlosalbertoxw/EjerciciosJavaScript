<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento mouseover</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
        h1 { font-size: 1.3rem; }
        p.intro { color: #555; }
        #zona { margin-top: 1rem; padding: 3rem 1rem; text-align: center; background: #f4f4f4; border-radius: 6px; transition: background .2s; }
        #zona.activa { background: #fde047; }
    </style>
</head>
<body>
    <h1>Eventos mouseover / mouseout</h1>
    <p class="intro">Pasa el ratón sobre la zona. <code>mouseover</code> se dispara al entrar y <code>mouseout</code> al salir.</p>
    <div id="zona">Pasa el ratón por aquí</div>

    <script>
        const zona = document.querySelector("#zona");

        zona.addEventListener("mouseover", () => {
            zona.classList.add("activa");
            zona.textContent = "¡El ratón está encima!";
        });

        zona.addEventListener("mouseout", () => {
            zona.classList.remove("activa");
            zona.textContent = "Pasa el ratón por aquí";
        });
    </script>
</body>
</html>
