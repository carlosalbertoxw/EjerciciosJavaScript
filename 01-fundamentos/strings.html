<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strings (texto)</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
        h1 { font-size: 1.3rem; }
        p.intro { color: #555; }
        pre { background: #f4f4f4; padding: .75rem 1rem; border-radius: 6px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Strings: trabajar con texto</h1>
    <p class="intro">Un string es una cadena de texto. Tiene propiedades y métodos para medirlo y transformarlo.</p>
    <pre id="salida"></pre>
    <script>
        const frase = "Hola Mundo";

        const salida = document.getElementById("salida");
        salida.textContent =
            `frase                 -> ${frase}\n` +
            `.length               -> ${frase.length}\n` +
            `.toUpperCase()        -> ${frase.toUpperCase()}\n` +
            `.toLowerCase()        -> ${frase.toLowerCase()}\n` +
            `.replace("Mundo","JS")-> ${frase.replace("Mundo", "JS")}\n` +
            `.includes("Mundo")    -> ${frase.includes("Mundo")}\n` +
            `.indexOf("Mundo")     -> ${frase.indexOf("Mundo")}\n` +
            `.slice(0, 4)          -> ${frase.slice(0, 4)}\n` +
            `.split(" ")           -> ${JSON.stringify(frase.split(" "))}\n\n` +
            // Template literal: se interpola con ${...} entre comillas invertidas ` `
            `Interpolación         -> La frase mide ${frase.length} caracteres`;
    </script>
</body>
</html>
