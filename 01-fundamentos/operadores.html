<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
        h1 { font-size: 1.3rem; }
        h2 { font-size: 1rem; margin-top: 1.5rem; }
        p.intro { color: #555; }
        pre { background: #f4f4f4; padding: .75rem 1rem; border-radius: 6px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Operadores</h1>
    <p class="intro">Cada operador se muestra junto con su resultado, para ver qué hace exactamente.</p>

    <h2>Aritméticos</h2>
    <pre id="aritmeticos"></pre>

    <h2>Comparación (fíjate en == vs ===)</h2>
    <pre id="comparacion"></pre>

    <h2>Lógicos</h2>
    <pre id="logicos"></pre>

    <script>
        document.getElementById("aritmeticos").textContent =
            `5 + 3  = ${5 + 3}\n` +
            `5 - 3  = ${5 - 3}\n` +
            `5 * 6  = ${5 * 6}\n` +
            `10 / 4 = ${10 / 4}\n` +
            `10 % 3 = ${10 % 3}   (resto de la división)\n` +
            `2 ** 8 = ${2 ** 8}   (potencia)`;

        // == compara solo el valor (convierte tipos). === compara valor Y tipo.
        document.getElementById("comparacion").textContent =
            `1 == "1"   -> ${1 == "1"}   (igualdad débil: convierte y son iguales)\n` +
            `1 === "1"  -> ${1 === "1"}  (igualdad estricta: distinto tipo)\n` +
            `1 != "1"   -> ${1 != "1"}\n` +
            `1 !== "1"  -> ${1 !== "1"}\n` +
            `2 > 1      -> ${2 > 1}\n` +
            `2 <= 2     -> ${2 <= 2}`;

        document.getElementById("logicos").textContent =
            `true && false -> ${true && false}   (Y: ambos deben ser true)\n` +
            `true || false -> ${true || false}   (O: basta uno true)\n` +
            `!true         -> ${!true}          (NO: invierte)`;
    </script>
</body>
</html>
