<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de datos</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
        h1 { font-size: 1.3rem; }
        p.intro { color: #555; }
        pre { background: #f4f4f4; padding: .75rem 1rem; border-radius: 6px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Tipos de datos</h1>
    <p class="intro">El operador <code>typeof</code> nos dice de qué tipo es un valor. Estos son los tipos básicos de JavaScript.</p>
    <pre id="salida"></pre>
    <script>
        const texto = "Hola";        // string
        const numero = 42;           // number
        const decimal = 3.14;        // number (no hay tipo aparte para decimales)
        const activo = true;         // boolean
        const nada = null;           // null (ausencia intencional de valor)
        let sinDefinir;              // undefined (declarada pero sin valor)
        const lista = [1, 2, 3];     // object (los arrays son objetos)
        const persona = { nombre: "Ana" }; // object

        const salida = document.getElementById("salida");
        salida.textContent =
            `typeof texto      -> ${typeof texto}\n` +
            `typeof numero     -> ${typeof numero}\n` +
            `typeof decimal    -> ${typeof decimal}\n` +
            `typeof activo     -> ${typeof activo}\n` +
            `typeof nada       -> ${typeof nada}   (error histórico de JavaScript: null no es un objeto)\n` +
            `typeof sinDefinir -> ${typeof sinDefinir}\n` +
            `typeof lista      -> ${typeof lista}   (para saber si es un array: Array.isArray -> ${Array.isArray(lista)})\n` +
            `typeof persona    -> ${typeof persona}`;
    </script>
</body>
</html>
