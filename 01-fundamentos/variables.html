<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
        h1 { font-size: 1.3rem; }
        p.intro { color: #555; }
        pre { background: #f4f4f4; padding: .75rem 1rem; border-radius: 6px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Variables: let y const</h1>
    <p class="intro">Una variable es un nombre que guarda un valor. Usa <code>const</code> si el valor no cambia y <code>let</code> si sí. Evita <code>var</code> (queda de versiones antiguas de JavaScript).</p>
    <pre id="salida"></pre>
    <script>
        // const: su valor NO se puede reasignar
        const nombre = "Carlos";

        // let: su valor SÍ se puede reasignar
        let edad = 30;
        edad = 31; // válido porque es let

        // Reasignar una const daría error:
        // nombre = "Otro"; // TypeError: Assignment to constant variable

        const salida = document.getElementById("salida");
        salida.textContent =
            `nombre (const) = ${nombre}\n` +
            `edad  (let)   = ${edad}`;
    </script>
</body>
</html>
