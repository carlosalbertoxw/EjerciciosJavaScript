<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parámetros y return</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
        h1 { font-size: 1.3rem; }
        p.intro { color: #555; }
        pre { background: #f4f4f4; padding: .75rem 1rem; border-radius: 6px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Parámetros y return</h1>
    <p class="intro">Los parámetros son los datos que entran a la función; <code>return</code> es el valor que sale. Una función sin <code>return</code> devuelve <code>undefined</code>.</p>
    <pre id="salida"></pre>
    <script>
        // Dos parámetros
        function sumar(a, b) {
            return a + b;
        }

        // Parámetro con valor por defecto
        function saludar(nombre = "invitado") {
            return `Bienvenido, ${nombre}`;
        }

        // Sin return: no devuelve nada (undefined)
        function noDevuelve(x) {
            const doble = x * 2; // calcula pero no retorna
        }

        const salida = document.getElementById("salida");
        salida.textContent =
            `sumar(3, 4)      -> ${sumar(3, 4)}\n` +
            `saludar("Ana")   -> ${saludar("Ana")}\n` +
            `saludar()        -> ${saludar()}   (usa el valor por defecto)\n` +
            `noDevuelve(5)    -> ${noDevuelve(5)}`;
    </script>
</body>
</html>
