<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Declarar funciones</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
        h1 { font-size: 1.3rem; }
        p.intro { color: #555; }
        pre { background: #f4f4f4; padding: .75rem 1rem; border-radius: 6px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Declarar una función</h1>
    <p class="intro">Una función es un bloque de código con nombre que puedes reutilizar. Hay tres formas comunes de escribirla; las tres hacen lo mismo.</p>
    <pre id="salida"></pre>
    <script>
        // 1) Declaración clásica
        function saludar(nombre) {
            return "Hola, " + nombre;
        }

        // 2) Función asignada a una constante (expresión de función)
        const despedir = function (nombre) {
            return "Adiós, " + nombre;
        };

        // 3) Función flecha (la forma moderna y más corta)
        const gritar = nombre => `¡${nombre.toUpperCase()}!`;

        const salida = document.getElementById("salida");
        salida.textContent =
            `saludar("Ana")  -> ${saludar("Ana")}\n` +
            `despedir("Ana") -> ${despedir("Ana")}\n` +
            `gritar("Ana")   -> ${gritar("Ana")}`;
    </script>
</body>
</html>
