<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>switch</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
        h1 { font-size: 1.3rem; }
        p.intro { color: #555; }
        pre { background: #f4f4f4; padding: .75rem 1rem; border-radius: 6px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>switch</h1>
    <p class="intro">Compara un valor contra varios casos. Es más legible que muchos <code>if/else</code> encadenados. No olvides el <code>break</code> en cada caso.</p>
    <pre id="salida"></pre>
    <script>
        const dias = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
        const numeroDia = new Date().getDay();
        let dia;

        switch (numeroDia) {
            case 0:
                dia = dias[0];
                break;
            case 6:
                dia = dias[6];
                break;
            default:
                dia = dias[numeroDia] + " (día laboral)";
                break;
        }

        document.getElementById("salida").textContent = `Hoy es ${dia}`;
    </script>
</body>
</html>
