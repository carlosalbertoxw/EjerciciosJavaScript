<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
        h1 { font-size: 1.3rem; }
        p.intro { color: #555; }
        pre { background: #f4f4f4; padding: .75rem 1rem; border-radius: 6px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Bucle for</h1>
    <p class="intro">Repite un bloque un número conocido de veces. Tiene tres partes: inicio, condición y paso.</p>
    <pre id="salida"></pre>
    <script>
        let lineas = "";

        // for (inicio; condición; paso)
        for (let i = 0; i <= 10; i++) {
            lineas += `i = ${i}\n`;
        }

        document.getElementById("salida").textContent = lineas;
    </script>
</body>
</html>
