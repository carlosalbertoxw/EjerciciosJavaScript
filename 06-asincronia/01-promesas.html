<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promesas</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
        h1 { font-size: 1.3rem; }
        p.intro { color: #555; }
        button { font-size: 1rem; padding: .5rem 1rem; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; margin-right: .25rem; }
        pre { background: #f4f4f4; padding: .75rem 1rem; border-radius: 6px; white-space: pre-wrap; min-height: 3em; }
    </style>
</head>
<body>
    <h1>Promesas</h1>
    <p class="intro">Una <code>Promise</code> representa un resultado que llegará más adelante. Se cumple con <code>resolve</code> o se rechaza con <code>reject</code>; con <code>then</code> y <code>catch</code> decidimos qué hacer en cada caso, sin congelar la página.</p>
    <button id="exito">Pedido correcto</button>
    <button id="fallo">Pedido con error</button>
    <pre id="salida"></pre>
    <script>
        const salida = document.querySelector("#salida");
        const registrar = texto => salida.textContent += `${texto}\n`;

        // Simula una operación lenta: tarda 1 segundo y luego termina bien o mal
        function pedirDatos(saldraBien) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    if (saldraBien) {
                        resolve("datos recibidos");
                    } else {
                        reject(new Error("el servidor no respondió"));
                    }
                }, 1000);
            });
        }

        function ejecutar(saldraBien) {
            salida.textContent = "";
            registrar("1. Se hace el pedido");

            pedirDatos(saldraBien)
                .then(resultado => registrar(`3. Resultado: ${resultado}`))
                .catch(error => registrar(`3. Error: ${error.message}`))
                .finally(() => registrar("4. Fin, haya salido bien o mal"));

            // Esta línea corre ANTES que el then: el código no se detiene a esperar
            registrar("2. La página sigue funcionando mientras espera...");
        }

        document.querySelector("#exito").addEventListener("click", () => ejecutar(true));
        document.querySelector("#fallo").addEventListener("click", () => ejecutar(false));
    </script>
</body>
</html>
